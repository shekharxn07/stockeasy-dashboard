version: '3.8'

services:
  backend:
    build: ./stockeasy-backend
    container_name: stockeasy-backend-compose
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    environment:
      - NODE_ENV=production
      - DB_HOST=db
      - DB_USER=root
      - DB_PASSWORD=Root123         
      - DB_NAME=stockeasy_db
      - EMAIL_USER=your-fsad31499@gmail.com  
      - EMAIL_PASS=spsf xeif jpff lvtj 
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8000/"]
      interval: 30s
      timeout: 3s
      retries: 3
    ports:
      - "8001:8000"
    networks:
      - app-network
    depends_on:
      db:
        condition: service_healthy
  
  frontend:
    build: ./stockeasy-frontend
    container_name: stockeasy-frontend-compose
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 3s
      retries: 3
    ports:
      - "3001:80"
    networks:
      - app-network
    depends_on:
      backend:
        condition: service_healthy

  db:
    image: mysql:8.0
    container_name: stockeasy-mysql-compose
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    environment:
      MYSQL_ROOT_PASSWORD: Root123
      MYSQL_DATABASE: stockeasy_db
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  db_data: